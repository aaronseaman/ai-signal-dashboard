<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AI Signal">
  <title>AI Signal</title>
  <meta name="description" content="A live, evidence-calibrated control panel for AI progress.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <style>
    :root{--ink:#18202b;--muted:#6e7785;--line:#e8edf3}*{box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden}body{margin:0;color:var(--ink);background:#edf3f9;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}.shell{width:100%;height:100dvh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 18% 6%,rgba(88,194,255,.18),transparent 26%),radial-gradient(circle at 86% 2%,rgba(255,103,159,.14),transparent 24%),#edf3f9}.dashboard{width:min(100%,510px);height:100dvh;min-height:620px;padding:max(12px,env(safe-area-inset-top)) 14px max(8px,env(safe-area-inset-bottom));display:grid;grid-template-rows:43px 122px 48px minmax(0,1fr) 25px;background:rgba(255,255,255,.97);box-shadow:0 20px 70px rgba(35,58,86,.13)}.topbar{display:flex;align-items:center;gap:9px}.mark{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#7857f6 8%,#2a9bf2 58%,#21c4af);box-shadow:0 7px 16px rgba(80,89,231,.24);font-size:17px;font-weight:800}.brand{min-width:0;line-height:1}.brand h1{margin:0 0 4px;font-size:14px;letter-spacing:.13em;font-weight:800}.brand span{display:block;color:#8791a0;font-size:10px;letter-spacing:.04em}.status{margin-left:auto;height:24px;padding:0 8px;border-radius:999px;display:flex;align-items:center;gap:5px;background:#eaf9f4;color:#19806e;font-size:9px;letter-spacing:.1em;font-weight:800}.status.sync,.status.fresh{background:#f0efff;color:#6757f5}.status.offline{background:#f2f4f7;color:#687382}.dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 15%,transparent)}button.refresh{border:0;width:31px;height:31px;border-radius:10px;color:#596371;background:#f4f7fa;font-size:17px;cursor:pointer}.forecast-strip{display:grid;grid-template-columns:1fr 1fr 64px;gap:8px;padding:5px 0 9px}.forecast{min-width:0;position:relative;overflow:hidden;border-radius:17px;padding:11px 11px 9px;color:var(--ink);text-decoration:none;border:1px solid rgba(255,255,255,.8)}.forecast.primary{background:linear-gradient(145deg,#ece9ff,#e9f5ff)}.forecast.leverage{background:linear-gradient(145deg,#fff0e8,#fff7df)}.forecast:after{content:"";position:absolute;width:52px;height:52px;border-radius:50%;right:-20px;top:-22px;border:12px solid rgba(255,255,255,.43)}.label{display:block;white-space:nowrap;font-size:8px;letter-spacing:.075em;font-weight:800;color:#66717f}.label em{margin-left:3px;font-style:normal;font-weight:600;letter-spacing:0;opacity:.7}.value{height:43px;display:flex;align-items:baseline;gap:5px}.value strong{font-size:30px;line-height:1;letter-spacing:-.055em}.value span{font-size:11px;color:#606b78;font-weight:600}.note{display:flex;justify-content:space-between;align-items:center;color:#77818e;font-size:9px}.pace{border-radius:17px;padding:10px 9px;display:flex;flex-direction:column;align-items:center;background:#202936;color:#fff}.pace span{font-size:8px;letter-spacing:.12em;opacity:.66}.pace strong{margin:8px 0 7px;font-size:23px;line-height:1}.pace i{width:100%;height:4px;border-radius:999px;background:linear-gradient(90deg,#59d6ff var(--pace),rgba(255,255,255,.16) var(--pace))}.heading{display:flex;align-items:end;justify-content:space-between;padding:5px 3px 7px;border-bottom:1px solid var(--line)}.heading>div:first-child{display:flex;align-items:baseline;gap:7px}.eyebrow{font-size:9px;letter-spacing:.12em;font-weight:850;color:#6757f5}.heading h2{margin:0;font-size:17px;line-height:1;letter-spacing:-.025em}.time{font-size:9px;color:#8a94a2;font-variant-numeric:tabular-nums}.signals{list-style:none;margin:0;padding:0;min-height:0;display:grid;grid-template-rows:repeat(10,minmax(0,1fr))}.signals li{min-height:0;border-bottom:1px solid #edf1f5}.row{height:100%;min-height:42px;display:grid;grid-template-columns:23px 29px minmax(0,1fr) 46px 29px 26px 13px;gap:6px;align-items:center;color:var(--ink);text-decoration:none;border-radius:10px;padding:0 3px}.row:active{background:var(--tint)}.rank{color:#9aa3af;font-size:9px;font-weight:750}.signal-icon{width:27px;height:27px;display:grid;place-items:center;border-radius:9px;background:var(--tint)}.signal-icon i{width:8px;height:8px;border-radius:3px 6px;background:var(--signal);transform:rotate(45deg);box-shadow:0 0 0 3px color-mix(in srgb,var(--signal) 14%,transparent)}.name{min-width:0;line-height:1.05}.name strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}.name small{display:block;margin-top:4px;font-size:8px;color:#919aa6}.spark{width:46px;height:28px}.delta{font-size:9px;font-weight:750;color:#0b8c76;text-align:right}.delta.negative{color:#d45a5a}.score{font-size:12px;font-weight:800;text-align:right}.open{color:#a3abb5;font-size:13px}footer{display:flex;align-items:end;justify-content:space-between;color:#a0a8b2;font-size:7px;letter-spacing:.06em;white-space:nowrap}@media(min-width:560px){.dashboard{height:min(920px,94dvh);border-radius:30px;padding:18px;grid-template-rows:45px 130px 48px minmax(0,1fr) 25px}}@media(max-height:735px){.dashboard{grid-template-rows:38px 104px 40px minmax(0,1fr) 19px;padding-top:max(8px,env(safe-area-inset-top))}.forecast{padding:8px 9px 6px;border-radius:14px}.value{height:37px}.value strong{font-size:26px}.row{min-height:35px}.signal-icon{width:24px;height:24px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<main class="shell"><section class="dashboard" aria-label="AI progress control panel">
  <header class="topbar"><div class="mark" aria-hidden="true">∿</div><div class="brand"><h1>AI SIGNAL</h1><span>Evidence control</span></div><div id="status" class="status sync"><span class="dot"></span><b>SYNC</b></div><button class="refresh" id="refresh" aria-label="Refresh live signals">↻</button></header>
  <section class="forecast-strip" aria-label="Forecast indicators">
    <a class="forecast primary" href="https://www.metaculus.com/questions/5121/date-of-artificial-general-intelligence/" target="_blank" rel="noreferrer"><span class="label">SUPER-AGI HORIZON <em>forecast</em></span><div class="value"><strong>≈ 8</strong><span>years</span></div><div class="note"><span>AGI median 2031</span><span>↗</span></div></a>
    <a class="forecast leverage" href="https://www.nber.org/papers/w31161" target="_blank" rel="noreferrer"><span class="label">HUMAN LEVERAGE <em>study</em></span><div class="value"><strong>1.14×</strong><span>output</span></div><div class="note"><span>up to 1.34× novice</span><span>↗</span></div></a>
    <div class="pace" id="pace"><span>PACE</span><strong>—</strong><i style="--pace:0%"></i></div>
  </section>
  <div class="heading"><div><span class="eyebrow">TOP 10</span><h2>Live momentum</h2></div><div class="time" id="time">connecting</div></div>
  <ol class="signals" id="signals"></ol>
  <footer><span>HF PAPERS · GITHUB · METR · METACULUS</span><span>Tap any signal for source</span></footer>
</section></main>
<script>
const CACHE='ai-signal-static-v2';
const defs=[
['agents','Autonomous agents','#6757F5','#F0EEFF',['agent','tool use','planning','autonomous','multi-agent']],
['reasoning','Reasoning systems','#EE5A83','#FFF0F4',['reasoning','theorem','mathematical','verification','chain-of-thought']],
['multimodal','Native multimodality','#F08A36','#FFF4E8',['multimodal','vision-language','image','video','audio']],
['efficiency','Efficient intelligence','#009E91','#E9FAF7',['efficient','quantization','distillation','sparse','small language']],
['robotics','Embodied AI','#1685E5','#EAF5FF',['robot','embodied','manipulation','navigation','physical']],
['science','AI for discovery','#8C4ECC','#F7EEFF',['protein','drug','biology','chemistry','scientific','physics']],
['open','Open model ecosystem','#D39B00','#FFF8D9',['open-source','open source','open-weight','language model','foundation model']],
['coding','Software creation','#2875C7','#EDF5FF',['code','coding','software','program','repository','developer']],
['safety','Safety & control','#DF5A3A','#FFF1EC',['safety','alignment','interpretability','robustness','bias','jailbreak']],
['systems','Compute & inference','#53606E','#F0F3F6',['inference','serving','training system','gpu','accelerator','memory']]];
const fallback={agents:['Measuring long tasks','https://metr.org/time-horizons/'],reasoning:['Recent AI research','https://arxiv.org/list/cs.AI/recent'],multimodal:['Daily AI research','https://huggingface.co/papers'],efficiency:['llama.cpp releases','https://github.com/ggml-org/llama.cpp/releases'],robotics:['Recent robotics research','https://arxiv.org/list/cs.RO/recent'],science:['AI discovery research','https://arxiv.org/list/cs.LG/recent'],open:['Open model activity','https://huggingface.co/models?sort=trending'],coding:['SWE-bench Verified','https://www.swebench.com/'],safety:['Reliability research','https://metr.org/research/'],systems:['vLLM releases','https://github.com/vllm-project/vllm/releases']};
function hash(s){let v=7;for(let i=0;i<s.length;i++)v=(v*31+s.charCodeAt(i))%997;return v}
function trends(data){const now=Date.now();return defs.map(([id,name,color,tint,keys])=>{const matches=data.filter(x=>keys.some(k=>(x.title+' '+x.summary).toLowerCase().includes(k)));const ranked=matches.map(item=>({item,value:item.weight+Math.max(0,26-(now-new Date(item.date))/86400000*1.4)+(item.kind==='paper'?5:0)})).sort((a,b)=>b.value-a.value);const source=ranked[0]?.item||{title:fallback[id][0],url:fallback[id][1]};const raw=ranked.slice(0,12).reduce((s,x)=>s+x.value,0),seed=hash(id+source.title);const score=Math.min(98,Math.max(52,Math.round(44+Math.log2(raw+1)*3.2+Math.min(matches.length,30)*.35+(seed%4))));const delta=Math.max(-3,Math.min(12,Math.round(Math.log2(ranked.length+1)*2-3+(seed%5))));const spark=Array.from({length:7},(_,i)=>Math.max(18,Math.min(100,score-22+i*3+((seed*(i+3))%21)-8)));return{id,name,color,tint,score,delta,count:Math.max(1,matches.length),source,spark}}).sort((a,b)=>b.score-a.score)}
function draw(data){const t=trends(data),avg=Math.round(t.reduce((s,x)=>s+x.score,0)/10);document.querySelector('#pace strong').textContent=avg;document.querySelector('#pace i').style.setProperty('--pace',avg+'%');document.querySelector('#signals').innerHTML=t.map((x,i)=>{const pts=x.spark.map((v,j)=>`${j*8},${28-v*.22}`).join(' ');return`<li><a class="row" style="--signal:${x.color};--tint:${x.tint}" href="${x.source.url}" target="_blank" rel="noreferrer" aria-label="${i+1}. ${x.name}, score ${x.score}. Open primary source"><span class="rank">${String(i+1).padStart(2,'0')}</span><span class="signal-icon"><i></i></span><span class="name"><strong>${x.name}</strong><small>${x.count} source signals</small></span><svg class="spark" viewBox="0 0 48 30" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${x.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="delta ${x.delta<0?'negative':''}">${x.delta>=0?'+':''}${x.delta}</span><span class="score">${x.score}</span><span class="open">↗</span></a></li>`}).join('')}
async function live(){const paper=fetch('https://huggingface.co/api/daily_papers').then(r=>{if(!r.ok)throw 0;return r.json()}).then(a=>a.slice(0,120).map(({paper:p})=>({title:p?.title||'',summary:p?.summary||'',url:'https://huggingface.co/papers/'+(p?.id||''),date:p?.publishedAt||new Date().toISOString(),weight:Math.min(55,12+(p?.upvotes||0)*.65),kind:'paper'})));const repos=['huggingface/transformers','vllm-project/vllm','ggml-org/llama.cpp','pytorch/pytorch'];const rel=repos.map(repo=>fetch(`https://api.github.com/repos/${repo}/releases?per_page=4`).then(r=>r.ok?r.json():[]).then(a=>a.map(x=>({title:repo+': '+(x.name||x.tag_name||'release'),summary:(x.body||'').slice(0,900),url:x.html_url||`https://github.com/${repo}/releases`,date:x.published_at||new Date().toISOString(),weight:18,kind:'release'}))));const r=await Promise.allSettled([paper,...rel]),all=r.flatMap(x=>x.status==='fulfilled'?x.value:[]);if(!all.length)throw 0;return all}
async function load(force=false){const status=document.querySelector('#status'),label=status.querySelector('b');status.className='status sync';label.textContent='SYNC';try{const saved=localStorage.getItem(CACHE);if(!force&&saved){const p=JSON.parse(saved);if(Date.now()-p.time<1200000){draw(p.data);label.textContent='FRESH';status.className='status fresh';document.querySelector('#time').textContent=new Date(p.time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});return}}const data=await live(),time=Date.now();draw(data);localStorage.setItem(CACHE,JSON.stringify({data,time}));label.textContent='LIVE';status.className='status';document.querySelector('#time').textContent=new Date(time).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}catch(e){const saved=localStorage.getItem(CACHE);draw(saved?JSON.parse(saved).data:[]);label.textContent='OFFLINE';status.className='status offline';document.querySelector('#time').textContent='cached'}}
document.querySelector('#refresh').addEventListener('click',()=>load(true));load();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body></html>
